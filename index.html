<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tarik Tambang</title>
  </head>
  <body>
    <div class="container">
      <div class="timA">
        <div class="wrapperTimA">
          <h2>TIM A</h2>
          <p id="pertanyaanA">pertanyaanA</p>
          <input type="text" id="jawabanA" placeholder="Jawaban Tim A" />
          <div id="keyboardA" class="keyboard"></div>
          <button class="jawabA">Jawab</button>
        </div>
      </div>
      <div class="bg">
        <div class="line"></div>
        <img src="image/2.png" alt="" />
      </div>
      <div class="timB">
        <div class="wrapperTimB">
          <h2>TIM B</h2>
          <div id="pertanyaanB">pertanyaanB</div>
          <input type="text" id="jawabanB" placeholder="Jawaban Tim B" />

          <div id="keyboardB" class="keyboard"></div>
          <button class="jawabB">Jawab</button>
        </div>
      </div>
    </div>

    <div class="alert-pemenangA">
      <p>Pemenangnya adalah</p>
      <h1>TIM A</h1>
      <a href="index.html">Play Again</a>
    </div>
    <div class="alert-pemenangB">
      <p>Pemenangnya adalah</p>
      <h1>TIM B</h1>
      <a href="index.html">Play Again</a>
    </div>

    <div class="startGame">
      <h3>GAME <br />TARIK TAMBANG</h3>
      <br />
      <button class="start">START</button>
    </div>

    <div class="countdown">
      <div class="text"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
